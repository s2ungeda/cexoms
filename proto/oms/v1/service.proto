syntax = "proto3";

package oms.v1;

option go_package = "github.com/mExOms/oms/pkg/proto/oms/v1;omsv1";

import "oms/v1/order.proto";
import "oms/v1/position.proto";
import "oms/v1/market_data.proto";
import "oms/v1/auth.proto";
import "oms/v1/account.proto";
import "oms/v1/strategy.proto";

// OrderService handles order operations
service OrderService {
    // Create a new order
    rpc CreateOrder(OrderRequest) returns (OrderResponse);
    
    // Cancel an existing order
    rpc CancelOrder(CancelOrderRequest) returns (OrderResponse);
    
    // Get order details
    rpc GetOrder(GetOrderRequest) returns (OrderResponse);
    
    // List orders with filters
    rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
}

// PositionService handles position queries
service PositionService {
    // Get a specific position
    rpc GetPosition(GetPositionRequest) returns (GetPositionResponse);
    
    // List all positions
    rpc ListPositions(ListPositionsRequest) returns (ListPositionsResponse);
    
    // Get aggregated positions across exchanges
    rpc GetAggregatedPositions(GetAggregatedPositionsRequest) returns (GetAggregatedPositionsResponse);
    
    // Get risk metrics
    rpc GetRiskMetrics(GetRiskMetricsRequest) returns (GetRiskMetricsResponse);
}

// MarketDataService handles market data
service MarketDataService {
    // Get current orderbook
    rpc GetOrderBook(GetOrderBookRequest) returns (OrderBook);
    
    // Get ticker data
    rpc GetTicker(GetTickerRequest) returns (Ticker);
    
    // Get recent trades
    rpc GetRecentTrades(GetRecentTradesRequest) returns (GetRecentTradesResponse);
    
    // Get historical klines
    rpc GetKlines(GetKlinesRequest) returns (GetKlinesResponse);
    
    // Subscribe to real-time market data
    rpc Subscribe(SubscribeRequest) returns (stream MarketDataUpdate);
}

// AuthService handles authentication
service AuthService {
    // Authenticate and get token
    rpc Authenticate(AuthRequest) returns (AuthResponse);
    
    // Refresh authentication token
    rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
    
    // Create new API key
    rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
    
    // List API keys
    rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
    
    // Revoke API key
    rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (RevokeAPIKeyResponse);
}

// AccountService handles multi-account operations
service AccountService {
    // Create a new account
    rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
    
    // Get account details
    rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
    
    // List all accounts
    rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
    
    // Get account balance
    rpc GetAccountBalance(GetAccountBalanceRequest) returns (GetAccountBalanceResponse);
    
    // Get account positions
    rpc GetAccountPositions(GetAccountPositionsRequest) returns (GetAccountPositionsResponse);
    
    // Transfer between accounts
    rpc Transfer(TransferRequest) returns (TransferResponse);
    
    // Get transfer history
    rpc GetTransferHistory(GetTransferHistoryRequest) returns (GetTransferHistoryResponse);
    
    // Get account metrics
    rpc GetAccountMetrics(GetAccountMetricsRequest) returns (GetAccountMetricsResponse);
    
    // Select best account for a strategy
    rpc SelectAccount(SelectAccountRequest) returns (SelectAccountResponse);
}

// StrategyService handles strategy operations
service StrategyService {
    // Create a new strategy
    rpc CreateStrategy(CreateStrategyRequest) returns (CreateStrategyResponse);
    
    // Get strategy details
    rpc GetStrategy(GetStrategyRequest) returns (GetStrategyResponse);
    
    // List all strategies
    rpc ListStrategies(ListStrategiesRequest) returns (ListStrategiesResponse);
    
    // Update strategy configuration
    rpc UpdateStrategy(UpdateStrategyRequest) returns (UpdateStrategyResponse);
    
    // Start a strategy
    rpc StartStrategy(StartStrategyRequest) returns (StartStrategyResponse);
    
    // Stop a strategy
    rpc StopStrategy(StopStrategyRequest) returns (StopStrategyResponse);
    
    // Get strategy metrics
    rpc GetStrategyMetrics(GetStrategyMetricsRequest) returns (GetStrategyMetricsResponse);
    
    // Get strategy positions
    rpc GetStrategyPositions(GetStrategyPositionsRequest) returns (GetStrategyPositionsResponse);
    
    // Assign accounts to strategy
    rpc AssignAccounts(AssignAccountsRequest) returns (AssignAccountsResponse);
}