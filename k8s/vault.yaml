apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: mexoms
  labels:
    app: vault
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: vault
    port: 8200
    targetPort: 8200
  - name: vault-cluster
    port: 8201
    targetPort: 8201
  selector:
    app: vault
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: mexoms
data:
  vault.hcl: |
    ui = true
    
    listener "tcp" {
      tls_disable = 0
      address = "[::]:8200"
      cluster_address = "[::]:8201"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file = "/vault/tls/tls.key"
    }
    
    storage "raft" {
      path = "/vault/data"
      
      retry_join {
        leader_api_addr = "https://vault-0.vault-service:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
      
      retry_join {
        leader_api_addr = "https://vault-1.vault-service:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
      
      retry_join {
        leader_api_addr = "https://vault-2.vault-service:8200"
        leader_ca_cert_file = "/vault/tls/ca.crt"
      }
    }
    
    seal "transit" {
      address = "https://vault-transit.vault-service:8200"
      disable_renewal = "false"
      key_name = "autounseal"
      mount_path = "transit/"
    }
    
    api_addr = "https://vault.mexoms.com"
    cluster_addr = "https://vault-POD_NAME.vault-service:8201"
    
    telemetry {
      prometheus_retention_time = "30s"
      disable_hostname = true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: mexoms
spec:
  serviceName: vault-service
  replicas: 3
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: vault
            topologyKey: kubernetes.io/hostname
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 1000
      containers:
      - name: vault
        image: vault:1.14.0
        command:
        - vault
        - server
        - -config=/vault/config/vault.hcl
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: VAULT_API_ADDR
          value: "https://$(POD_NAME).vault-service:8200"
        - name: VAULT_CLUSTER_ADDR
          value: "https://$(POD_NAME).vault-service:8201"
        - name: VAULT_RAFT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8200
          name: vault
        - containerPort: 8201
          name: vault-cluster
        - containerPort: 8202
          name: vault-metrics
        volumeMounts:
        - name: data
          mountPath: /vault/data
        - name: config
          mountPath: /vault/config
        - name: tls
          mountPath: /vault/tls
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          capabilities:
            add:
            - IPC_LOCK
        livenessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health?standbyok=true&perfstandbyok=true
            port: 8200
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: tls
        secret:
          secretName: vault-tls
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: mexoms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault
subjects:
- kind: ServiceAccount
  name: vault
  namespace: mexoms
---
apiVersion: v1
kind: Secret
metadata:
  name: vault-tls
  namespace: mexoms
type: kubernetes.io/tls
data:
  # Generate with cert-manager or manually
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...
  ca.crt: LS0tLS1CRUdJTi...