apiVersion: v1
kind: Namespace
metadata:
  name: mexoms
  labels:
    name: mexoms
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mexoms-quota
  namespace: mexoms
spec:
  hard:
    requests.cpu: "100"
    requests.memory: "100Gi"
    limits.cpu: "200"
    limits.memory: "200Gi"
    persistentvolumeclaims: "20"
    services.loadbalancers: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mexoms-limit-range
  namespace: mexoms
spec:
  limits:
  - default:
      cpu: "2"
      memory: "4Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      storage: "50Gi"
    type: PersistentVolumeClaim