apiVersion: v1
kind: Service
metadata:
  name: binance-spot-service
  namespace: mexoms
  labels:
    app: binance-spot
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8083
    targetPort: 8083
  selector:
    app: binance-spot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: binance-spot
  namespace: mexoms
  labels:
    app: binance-spot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: binance-spot
  template:
    metadata:
      labels:
        app: binance-spot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: exchange-connector
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: binance-spot
        image: mexoms/binance-spot:latest
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: SERVICE_NAME
          value: binance-spot
        - name: NATS_URL
          value: nats://nats-service:4222
        - name: REDIS_ADDR
          value: redis-service:6379
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mexoms-secrets
              key: redis-password
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: mexoms-secrets
              key: binance-api-key
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mexoms-secrets
              key: binance-secret-key
        - name: LOG_LEVEL
          value: info
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - binance-spot
              topologyKey: kubernetes.io/hostname
---
