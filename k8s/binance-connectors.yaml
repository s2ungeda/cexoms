---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: exchange-connector
  namespace: mexoms
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: binance-spot-hpa
  namespace: mexoms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: binance-spot
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: binance-futures-hpa
  namespace: mexoms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
