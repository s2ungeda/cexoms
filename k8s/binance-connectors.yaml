        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: binance-spot-pdb
  namespace: mexoms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: binance-spot
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: binance-futures-pdb
  namespace: mexoms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: binance-futures