apiVersion: v1
kind: Service
metadata:
  name: nats-service
  namespace: mexoms
  labels:
    app: nats
spec:
  type: ClusterIP
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitor
    port: 8222
    targetPort: 8222
  - name: cluster
    port: 6222
    targetPort: 6222
  selector:
    app: nats
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: mexoms
data:
  nats.conf: |
    # NATS Server Configuration for mExOms
    port: 4222
    http: 8222
    
    # Clustering
    cluster {
      port: 6222
      routes [
        nats-route://nats-0.nats-service.mexoms.svc.cluster.local:6222
        nats-route://nats-1.nats-service.mexoms.svc.cluster.local:6222
        nats-route://nats-2.nats-service.mexoms.svc.cluster.local:6222
      ]
      
      cluster_advertise: $CLUSTER_ADVERTISE
      connect_retries: 30
    }
    
    # JetStream
    jetstream {
      store_dir: /data/jetstream
      max_mem: 1G
      max_file: 10G
    }
    
    # Logging
    debug: false
    trace: false
    logtime: true
    
    # Authorization
    authorization {
      default_permissions {
        publish = ["_INBOX.>"]
        subscribe = ["_INBOX.>"]
      }
      
      users = [
        {
          user: "oms-server"
          password: "$2a$11$W2zko751KUvVy59mUTWmpOdWjpEm5qhcCZRd05GjI/sSOT.xtiHyG"
          permissions {
            publish = [">"]
            subscribe = [">"]
          }
        }
      ]
    }
    
    # Limits
    max_connections: 10000
    max_control_line: 4096
    max_payload: 1048576
    
    # TLS
    # tls {
    #   cert_file: "/certs/server.crt"
    #   key_file: "/certs/server.key"
    #   ca_file: "/certs/ca.crt"
    #   verify: true
    # }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: mexoms
spec:
  serviceName: nats-service
  replicas: 3
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - nats
            topologyKey: kubernetes.io/hostname
      containers:
      - name: nats
        image: nats:2.10-alpine
        command: ["nats-server", "-c", "/etc/nats/nats.conf"]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_ADVERTISE
          value: $(POD_NAME).nats-service.$(POD_NAMESPACE).svc
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitor
        - containerPort: 6222
          name: cluster
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: nats-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi