apiVersion: v1
kind: Secret
metadata:
  name: mexoms-secrets
  namespace: mexoms
type: Opaque
stringData:
  # Database credentials
  postgres-user: mexoms
  postgres-password: changeme-prod-password
  postgres-root-password: changeme-root-password
  
  # Redis password
  redis-password: changeme-redis-password
  
  # JWT secret
  jwt-secret: changeme-jwt-secret-key-minimum-32-characters-long
  
  # Vault token
  vault-token: changeme-vault-token
  
  # Exchange API keys (encrypted)
  binance-api-key: encrypted-binance-api-key
  binance-secret-key: encrypted-binance-secret-key
  
---
apiVersion: v1
kind: Secret
metadata:
  name: mexoms-tls
  namespace: mexoms
type: kubernetes.io/tls
data:
  # Base64 encoded TLS certificate and key
  # Generate with: kubectl create secret tls mexoms-tls --cert=path/to/tls.crt --key=path/to/tls.key
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...
  
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: mexoms
type: kubernetes.io/dockerconfigjson
data:
