apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mexoms-ingress
  namespace: mexoms
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.mexoms.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-API-Key"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
  - hosts:
    - api.mexoms.com
    - grpc.mexoms.com
    - metrics.mexoms.com
    secretName: mexoms-tls
  rules:
  - host: api.mexoms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oms-server-service
            port:
              number: 8080
  - host: grpc.mexoms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oms-server-service
            port:
              number: 9090
  - host: metrics.mexoms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oms-server-service
            port:
              number: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: mexoms
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  tls:
  - hosts:
    - prometheus.mexoms.com
    - grafana.mexoms.com
    secretName: monitoring-tls
  rules:
  - host: prometheus.mexoms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
  - host: grafana.mexoms.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth
  namespace: mexoms
type: Opaque
data:
  auth: |
    # htpasswd -nb admin changeme
    YWRtaW46JGFwcjEkN1RaLkguSEEkRnJlbVdaNkRYU2FMYVFEaVVjMW8xLw==
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mexoms-network-policy
  namespace: mexoms
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 169.254.169.254/32  # Block metadata service
    ports:
    - protocol: TCP
      port: 443  # HTTPS for external APIs