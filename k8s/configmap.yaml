apiVersion: v1
kind: ConfigMap
metadata:
  name: mexoms-config
  namespace: mexoms
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      grpc_port: 9090
      metrics_port: 8081
      mode: production
      
    database:
      host: postgres-service
      port: 5432
      name: mexoms
      user: mexoms
      sslmode: require
      max_connections: 100
      max_idle_connections: 10
      connection_max_lifetime: 30m
      
    redis:
      host: redis-service
      port: 6379
      db: 0
      pool_size: 100
      min_idle_conns: 10
      
    nats:
      servers:
        - nats://nats-service:4222
      cluster_id: mexoms-cluster
      client_id: oms-server
      
    monitoring:
      prometheus_enabled: true
      tracing_enabled: true
      logging_level: info
      
    security:
      jwt_secret_key_ref: jwt-secret
      api_key_header: X-API-Key
      cors_enabled: true
      cors_origins:
        - "https://app.mexoms.com"
        - "https://api.mexoms.com"
        
    performance:
      worker_threads: 8
      buffer_size: 10000
      batch_size: 100
      
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mexoms-scripts
  namespace: mexoms
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    
    echo "Initializing database..."
    
    # Wait for PostgreSQL to be ready
    until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER; do
      echo "Waiting for PostgreSQL..."
      sleep 2
    done
    
    # Create database if not exists
    psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -tc "SELECT 1 FROM pg_database WHERE datname = 'mexoms'" | grep -q 1 || \
    psql -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER -c "CREATE DATABASE mexoms"
    
    # Run migrations
    echo "Running migrations..."
    /app/bin/migrate up
    
    echo "Database initialization complete"
    
  health-check.sh: |
    #!/bin/bash
    # Health check script
    
    # Check HTTP endpoint
    curl -f http://localhost:8080/api/v1/health || exit 1
    
    # Check gRPC endpoint
    grpc_health_probe -addr=:9090 || exit 1
    
    # Check database connection
    nc -zv postgres-service 5432 || exit 1
    
    # Check Redis connection
    nc -zv redis-service 6379 || exit 1
    
    # Check NATS connection
    nc -zv nats-service 4222 || exit 1
    
    exit 0