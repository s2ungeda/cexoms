stages:
  - build
  - test
  - security
  - package
  - deploy
  - verify

variables:
  GO_VERSION: "1.21"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_REGISTRY: registry.gitlab.com
  KUBERNETES_VERSION: "1.28.0"
  HELM_VERSION: "3.12.0"

.go-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .go/pkg/mod/
      - .go/build-cache/

.docker-cache:
  cache:
    key: ${CI_COMMIT_REF_SLUG}-docker
    paths:
      - /var/lib/docker/

# Build stage
build:cpp:
  stage: build
  image: gcc:12
  before_script:
    - apt-get update && apt-get install -y cmake libboost-all-dev
  script:
    - cd core
    - mkdir -p build && cd build
    - cmake -DCMAKE_BUILD_TYPE=Release ..
    - make -j$(nproc)
  artifacts:
    paths:
      - core/build/
    expire_in: 1 week

build:go:
  stage: build
  image: golang:${GO_VERSION}
  extends: .go-cache
  before_script:
    - mkdir -p .go
    - export GOPATH=$PWD/.go
  script:
    - go mod download
    - go build -v -o bin/ ./...
  artifacts:
    paths:
      - bin/
    expire_in: 1 week

# Test stage
test:unit:
  stage: test
  image: golang:${GO_VERSION}
  extends: .go-cache
  services:
    - postgres:15
    - redis:7-alpine
    - nats:2.10-alpine
  variables:
    POSTGRES_DB: mexoms_test
    POSTGRES_USER: mexoms
    POSTGRES_PASSWORD: test
    DATABASE_HOST: postgres
    REDIS_ADDR: redis:6379
    NATS_URL: nats://nats:4222
  script:
    - go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
    - go tool cover -html=coverage.txt -o coverage.html
  coverage: '/total:\s+\(statements\)\s+(\d+.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.html
    expire_in: 1 week

test:integration:
  stage: test
  image: golang:${GO_VERSION}
  services:
    - docker:24-dind
  before_script:
    - apt-get update && apt-get install -y docker-compose
  script:
    - docker-compose -f docker-compose.test.yml up -d
    - sleep 30
    - go test -v -tags=integration ./tests/integration/...
  after_script:
    - docker-compose -f docker-compose.test.yml down
  only:
    - main
    - develop
    - merge_requests

test:benchmark:
  stage: test
  image: golang:${GO_VERSION}
  extends: .go-cache
  script:
    - go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt
  artifacts:
    paths:
      - benchmark.txt
    expire_in: 1 week
  only:
    - main
    - develop

# Security stage
security:sast:
  stage: security
  include:
    - template: Security/SAST.gitlab-ci.yml
  variables:
    SAST_EXCLUDED_PATHS: "vendor,testdata"

security:dependency:
  stage: security
  image: golang:${GO_VERSION}
  script:
    - go install github.com/sonatype-nexus-community/nancy@latest
    - go list -json -deps ./... | nancy sleuth
  allow_failure: true

security:container:
  stage: security
  image: aquasec/trivy:latest
  services:
    - docker:24-dind
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
  dependencies:
    - build:docker
  only:
    - main
    - develop

security:secrets:
  stage: security
  image: trufflesecurity/trufflehog:latest
  script:
    - trufflehog git file://. --since-commit main --fail

# Package stage
build:docker:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  extends: .docker-cache
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      for service in oms-server binance-spot binance-futures monitor; do
        docker build -f Dockerfile.$service -t $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA .
        docker push $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA
        
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          docker tag $CI_REGISTRY_IMAGE/$service:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/$service:latest
          docker push $CI_REGISTRY_IMAGE/$service:latest
        fi
      done
  only:
    - main
    - develop
    - tags

build:helm:
  stage: package
  image: alpine/helm:${HELM_VERSION}
  script:
    - helm package helm/mexoms --version=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - helm repo index . --url https://charts.mexoms.com
  artifacts:
    paths:
      - "*.tgz"
      - index.yaml
    expire_in: 1 week
  only:
    - main
    - tags

# Deploy stage
.deploy:
  image: alpine/helm:${HELM_VERSION}
  before_script:
    - apk add --no-cache curl
    - curl -LO https://dl.k8s.io/release/v${KUBERNETES_VERSION}/bin/linux/amd64/kubectl
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - kubectl config set-cluster k8s --server="$KUBE_URL" --insecure-skip-tls-verify=true
    - kubectl config set-credentials gitlab --token="$KUBE_TOKEN"
    - kubectl config set-context default --cluster=k8s --user=gitlab
    - kubectl config use-context default

deploy:dev:
  extends: .deploy
  stage: deploy
  script:
    - |
      helm upgrade --install mexoms-dev ./helm/mexoms \
        --namespace mexoms-dev \
        --create-namespace \
        --values ./helm/mexoms/values-dev.yaml \
        --set image.tag=$CI_COMMIT_SHA \
        --wait \
        --timeout 10m
  environment:
    name: development
    url: https://dev.mexoms.com
    kubernetes:
      namespace: mexoms-dev
  only:
    - develop

deploy:staging:
  extends: .deploy
  stage: deploy
  script:
    - |
      # Blue-Green deployment
      helm upgrade --install mexoms-staging-green ./helm/mexoms \
        --namespace mexoms-staging \
        --create-namespace \
        --values ./helm/mexoms/values.yaml \
        --set image.tag=$CI_COMMIT_SHA \
        --set global.blueGreen.color=green \
        --wait \
        --timeout 10m
  environment:
    name: staging
    url: https://staging.mexoms.com
    kubernetes:
      namespace: mexoms-staging
  only:
    - main

deploy:production:
  extends: .deploy
  stage: deploy
  script:
    - |
      # Canary deployment
      helm upgrade --install mexoms-prod-canary ./helm/mexoms \
        --namespace mexoms \
        --create-namespace \
        --values ./helm/mexoms/values-prod.yaml \
        --set image.tag=$CI_COMMIT_SHA \
        --set canary.enabled=true \
        --set canary.weight=10 \
        --wait \
        --timeout 15m
  environment:
    name: production
    url: https://mexoms.com
    kubernetes:
      namespace: mexoms
  when: manual
  only:
    - tags

# Verify stage
verify:smoke:
  stage: verify
  image: curlimages/curl:latest
  script:
    - |
      case $CI_ENVIRONMENT_NAME in
        development)
          URL="https://dev.mexoms.com"
          ;;
        staging)
          URL="https://staging.mexoms.com"
          ;;
        production)
          URL="https://mexoms.com"
          ;;
      esac
      
      curl -f $URL/health || exit 1
      curl -f $URL/api/v1/health || exit 1
  dependencies: []

verify:e2e:
  stage: verify
  image: cypress/included:12.17.0
  script:
    - cypress run --config baseUrl=$CI_ENVIRONMENT_URL
  artifacts:
    when: always
    paths:
      - cypress/videos/
      - cypress/screenshots/
    expire_in: 1 week
  only:
    - main
    - develop