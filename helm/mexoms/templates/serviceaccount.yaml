{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mexoms.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mexoms.serviceAccountName" . }}-exchange
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
    app.kubernetes.io/component: exchange-connector
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.rbac.create .Values.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mexoms.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mexoms.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mexoms.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "mexoms.serviceAccountName" . }}
  namespace: {{ .Values.global.namespace }}
- kind: ServiceAccount
  name: {{ include "mexoms.serviceAccountName" . }}-exchange
  namespace: {{ .Values.global.namespace }}
{{- end }}