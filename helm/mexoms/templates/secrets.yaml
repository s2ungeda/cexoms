{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mexoms.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Database credentials
  postgres-user: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  postgres-root-password: {{ .Values.postgresql.auth.postgresPassword | quote }}
  
  # Redis password
  redis-password: {{ .Values.redis.auth.password | quote }}
  
  # JWT secret
  jwt-secret: {{ .Values.security.jwtSecret | default (randAlphaNum 32) | quote }}
  
  # Vault token
  vault-token: {{ .Values.vault.token | default (randAlphaNum 32) | quote }}
  
  # Exchange API keys (should be provided externally in production)
  {{- range $exchange, $config := .Values.exchanges }}
  {{ $exchange }}-api-key: {{ $config.apiKey | default "changeme" | quote }}
  {{ $exchange }}-secret-key: {{ $config.secretKey | default "changeme" | quote }}
  {{- end }}
---
{{- if .Values.security.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mexoms.fullname" . }}-tls
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  {{- if .Values.security.tls.cert }}
  tls.crt: {{ .Values.security.tls.cert | b64enc }}
  {{- else }}
  tls.crt: LS0tLS1CRUdJTi... # Placeholder - will be replaced by cert-manager
  {{- end }}
  {{- if .Values.security.tls.key }}
  tls.key: {{ .Values.security.tls.key | b64enc }}
  {{- else }}
  tls.key: LS0tLS1CRUdJTi... # Placeholder - will be replaced by cert-manager
  {{- end }}
{{- end }}
---
{{- if .Values.dockerRegistry.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mexoms.fullname" . }}-docker-registry
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "mexoms.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ template "imagePullSecret" . }}
{{- end }}
{{- end }}

{{/*
Generate image pull secret
*/}}
{{- define "imagePullSecret" }}
{{- with .Values.dockerRegistry }}
{{- printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .server .username .password .email (printf "%s:%s" .username .password | b64enc) | b64enc }}
{{- end }}
{{- end }}