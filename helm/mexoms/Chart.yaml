apiVersion: v2
name: mexoms
description: Multi-Exchange Cryptocurrency Order Management System
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - cryptocurrency
  - trading
  - order-management
  - multi-exchange
home: https://github.com/mexoms/mexoms
sources:
  - https://github.com/mexoms/mexoms
maintainers:
  - name: mExOms Team
    email: admin@mexoms.com
dependencies:
  - name: postgresql
    version: "12.1.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.3.0"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: nats
    version: "0.19.0"
    repository: "https://nats-io.github.io/k8s/helm/charts/"
    condition: nats.enabled