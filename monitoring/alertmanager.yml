global:
  # SMTP configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@mexoms.com'
  smtp_auth_username: 'alerts@mexoms.com'
  smtp_auth_password: 'your-app-password'
  
  # Slack configuration
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
  
  # PagerDuty configuration
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route tree
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']
  
  # Wait time before sending group notification
  group_wait: 10s
  
  # Wait time before sending notification about new alerts in group
  group_interval: 5m
  
  # Wait time before resending notification
  repeat_interval: 4h
  
  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h
      continue: true
      
    # Trading team alerts
    - match:
        team: trading
      receiver: 'trading-team'
      routes:
        - match:
            severity: critical
          receiver: 'trading-oncall'
          
    # Risk team alerts
    - match:
        team: risk
      receiver: 'risk-team'
      routes:
        - match:
            severity: critical
          receiver: 'risk-oncall'
          
    # Platform team alerts
    - match:
        team: platform
      receiver: 'platform-team'
      
    # Security alerts
    - match:
        team: security
      receiver: 'security-team'
      group_wait: 0s
      
    # Business hours only (non-critical)
    - match_re:
        severity: 'warning|info'
      receiver: 'business-hours'
      active_time_intervals:
        - business-hours

# Receivers
receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/DEFAULT/WEBHOOK'
        channel: '#alerts'
        title: 'mExOms Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        
  - name: 'critical'
    pagerduty_configs:
      - service_key: 'YOUR-PAGERDUTY-SERVICE-KEY'
        description: '{{ template "pagerduty.default.description" . }}'
        details:
          firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
          resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
          num_firing: '{{ .Alerts.Firing | len }}'
          num_resolved: '{{ .Alerts.Resolved | len }}'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/CRITICAL/WEBHOOK'
        channel: '#critical-alerts'
        username: 'Critical Alert'
        icon_emoji: ':rotating_light:'
        title: 'CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    email_configs:
      - to: 'oncall@mexoms.com'
        headers:
          Subject: 'CRITICAL: {{ .GroupLabels.alertname }}'
        
  - name: 'trading-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/TRADING/WEBHOOK'
        channel: '#trading-alerts'
        title: 'Trading Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        actions:
          - type: button
            text: 'View Dashboard'
            url: '{{ (index .Alerts 0).Annotations.dashboard }}'
            
  - name: 'trading-oncall'
    pagerduty_configs:
      - service_key: 'YOUR-TRADING-PAGERDUTY-KEY'
    webhook_configs:
      - url: 'https://api.opsgenie.com/v1/json/integrations/webhooks/YOUR-KEY'
        send_resolved: true
        
  - name: 'risk-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/RISK/WEBHOOK'
        channel: '#risk-alerts'
        username: 'Risk Monitor'
        icon_emoji: ':warning:'
        title: 'Risk Alert: {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Account:* {{ .Labels.account }}
          *Description:* {{ .Annotations.description }}
          *Value:* {{ .Labels.value }}
          {{ end }}
          
  - name: 'risk-oncall'
    pagerduty_configs:
      - service_key: 'YOUR-RISK-PAGERDUTY-KEY'
    sms_configs:
      - api_url: 'https://api.twilio.com/2010-04-01/Accounts/YOUR-ACCOUNT/Messages.json'
        to: '+1234567890'
        from: '+0987654321'
        body: 'RISK ALERT: {{ .GroupLabels.alertname }} - {{ .CommonAnnotations.summary }}'
        
  - name: 'platform-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/PLATFORM/WEBHOOK'
        channel: '#platform-alerts'
        title: 'Platform Alert: {{ .GroupLabels.alertname }}'
        send_resolved: true
    email_configs:
      - to: 'platform-team@mexoms.com'
        send_resolved: true
        
  - name: 'security-team'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SECURITY/WEBHOOK'
        channel: '#security-alerts-private'
        username: 'Security Alert'
        icon_emoji: ':lock:'
        title: 'SECURITY: {{ .GroupLabels.alertname }}'
        text: |
          *Severity:* {{ .CommonLabels.severity }}
          *Details:* {{ .CommonAnnotations.description }}
          *Time:* {{ .Alerts.Firing | len }} active alerts
    pagerduty_configs:
      - service_key: 'YOUR-SECURITY-PAGERDUTY-KEY'
        severity: 'critical'
        
  - name: 'business-hours'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/BUSINESS/WEBHOOK'
        channel: '#alerts-non-critical'
        send_resolved: false

# Inhibition rules
inhibit_rules:
  # Inhibit warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    
  # Inhibit all alerts when maintenance mode is active
  - source_match:
      alertname: 'MaintenanceMode'
    target_match_re:
      alertname: '.*'
    equal: ['instance']

# Time intervals
time_intervals:
  - name: business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '09:00'
            end_time: '18:00'
        location: 'America/New_York'