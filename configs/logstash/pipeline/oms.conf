input {
  # Collect logs from OMS services
  file {
    path => "/var/log/oms/*.log"
    start_position => "beginning"
    codec => "json"
    tags => ["oms", "service"]
  }

  # Collect logs from Docker containers
  docker {
    host => "unix:///var/run/docker.sock"
    tags => ["docker", "container"]
  }

  # Collect metrics from Prometheus
  http_poller {
    urls => {
      prometheus => "http://prometheus:9090/api/v1/query"
    }
    request_timeout => 60
    schedule => { every => "30s" }
    codec => "json"
    tags => ["prometheus", "metrics"]
  }

  # Collect traces from OpenTelemetry
  tcp {
    port => 5514
    codec => json_lines
    tags => ["opentelemetry", "traces"]
  }
}

filter {
  # Parse OMS service logs
  if "oms" in [tags] {
    # Extract fields from structured logs
    json {
      source => "message"
      target => "oms"
    }

    # Parse timestamp
    date {
      match => [ "[oms][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }

    # Extract exchange and market information
    if [oms][exchange] {
      mutate {
        add_field => {
          "exchange" => "%{[oms][exchange]}"
          "market" => "%{[oms][market]}"
        }
      }
    }

    # Extract order information
    if [oms][order_id] {
      mutate {
        add_field => {
          "order_id" => "%{[oms][order_id]}"
          "order_type" => "%{[oms][order_type]}"
          "order_side" => "%{[oms][order_side]}"
          "order_status" => "%{[oms][order_status]}"
        }
      }
    }

    # Calculate order latency if timestamps are available
    if [oms][order_created_at] and [oms][order_completed_at] {
      ruby {
        code => "
          created = Time.parse(event.get('[oms][order_created_at]'))
          completed = Time.parse(event.get('[oms][order_completed_at]'))
          latency_ms = (completed - created) * 1000
          event.set('order_latency_ms', latency_ms)
        "
      }
    }

    # Extract error information
    if [oms][error] {
      mutate {
        add_field => {
          "error_type" => "%{[oms][error][type]}"
          "error_message" => "%{[oms][error][message]}"
        }
        add_tag => [ "error" ]
      }
    }

    # Extract WebSocket information
    if [oms][websocket] {
      mutate {
        add_field => {
          "ws_stream_type" => "%{[oms][websocket][stream_type]}"
          "ws_message_type" => "%{[oms][websocket][message_type]}"
        }
      }
    }
  }

  # Parse Docker container logs
  if "docker" in [tags] {
    # Extract container name
    mutate {
      add_field => {
        "container_name" => "%{[docker][container][name]}"
        "container_id" => "%{[docker][container][id]}"
      }
    }

    # Parse container logs based on service
    if [container_name] =~ /binance/ {
      mutate {
        add_field => { "service" => "binance" }
      }
    } else if [container_name] =~ /risk/ {
      mutate {
        add_field => { "service" => "risk_management" }
      }
    } else if [container_name] =~ /router/ {
      mutate {
        add_field => { "service" => "smart_router" }
      }
    }
  }

  # Parse Prometheus metrics
  if "prometheus" in [tags] {
    # Extract metric name and labels
    ruby {
      code => "
        metrics = event.get('[data][result]')
        if metrics && metrics.is_a?(Array)
          metrics.each do |metric|
            metric_name = metric['metric']['__name__']
            event.set('metric_name', metric_name)
            event.set('metric_value', metric['value'][1])
            
            # Extract labels
            metric['metric'].each do |k, v|
              unless k == '__name__'
                event.set(\"metric_label_#{k}\", v)
              end
            end
          end
        end
      "
    }
  }

  # Parse OpenTelemetry traces
  if "opentelemetry" in [tags] {
    # Extract trace and span information
    mutate {
      add_field => {
        "trace_id" => "%{[trace_id]}"
        "span_id" => "%{[span_id]}"
        "parent_span_id" => "%{[parent_span_id]}"
        "operation_name" => "%{[operation_name]}"
      }
    }

    # Calculate span duration
    if [start_time] and [end_time] {
      ruby {
        code => "
          start_time = event.get('start_time')
          end_time = event.get('end_time')
          duration_ms = (end_time - start_time) / 1000000.0
          event.set('span_duration_ms', duration_ms)
        "
      }
    }
  }

  # Add environment information
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "datacenter" => "${DATACENTER:local}"
    }
  }

  # Remove sensitive information
  mutate {
    remove_field => [ "api_key", "secret_key", "password", "token" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "oms-%{+YYYY.MM.dd}"
    template_name => "oms"
    template => "/etc/logstash/templates/oms-template.json"
    template_overwrite => true
  }

  # Send errors to a separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "oms-errors-%{+YYYY.MM.dd}"
    }
  }

  # Send critical alerts to monitoring system
  if [level] == "critical" or [error_type] == "FATAL" {
    http {
      url => "${ALERT_WEBHOOK_URL}"
      http_method => "post"
      format => "json"
      mapping => {
        "alert_type" => "critical_error"
        "service" => "%{service}"
        "message" => "%{message}"
        "timestamp" => "%{@timestamp}"
      }
    }
  }

  # Debug output (remove in production)
  if "${DEBUG_MODE:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}