# Transfer and Rebalancing Configuration

transfer:
  # Enable automatic rebalancing
  enable_auto_rebalance: true
  
  # Rebalance schedule (cron format)
  # Daily at 00:00 UTC
  rebalance_schedule: "0 0 * * *"
  
  # Maximum retries for failed transfers
  max_retries: 3
  
  # Retry delay between attempts
  retry_delay: 5s

# Minimum balance requirements for main account
min_main_balance:
  USDT: 10000.0
  BTC: 0.1
  ETH: 1.0
  BNB: 10.0

# Maximum balance limits for sub accounts
max_sub_balance:
  USDT: 50000.0
  BTC: 1.0
  ETH: 10.0
  BNB: 100.0

# Target balance ratios for different strategies
target_ratios:
  arbitrage:
    USDT: 0.3    # 30% of total USDT
    BTC: 0.1     # 10% of total BTC
    ETH: 0.1     # 10% of total ETH
    BNB: 0.2     # 20% of total BNB (for fees)
  
  market_making:
    USDT: 0.4    # 40% of total USDT
    BTC: 0.15    # 15% of total BTC
    ETH: 0.15    # 15% of total ETH
    BNB: 0.3     # 30% of total BNB (for fees)
  
  trend_following:
    USDT: 0.3    # 30% of total USDT
    BTC: 0.05    # 5% of total BTC
    ETH: 0.05    # 5% of total ETH
    BNB: 0.1     # 10% of total BNB

# Transfer limits
transfer_limits:
  # Hourly limits
  hourly:
    USDT: 500000.0
    BTC: 5.0
    ETH: 50.0
    BNB: 500.0
    max_transfers: 50
  
  # Daily limits
  daily:
    USDT: 5000000.0
    BTC: 50.0
    ETH: 500.0
    BNB: 5000.0
    max_transfers: 200

# Minimum transfer amounts
min_transfer_amount:
  USDT: 10.0
  BTC: 0.0001
  ETH: 0.001
  BNB: 0.01

# Scheduled tasks
scheduled_tasks:
  # Daily rebalance at midnight UTC
  daily_rebalance:
    enabled: true
    schedule: "0 0 * * *"
    description: "Daily account rebalancing"
  
  # Hourly rebalance (disabled by default)
  hourly_rebalance:
    enabled: false
    schedule: "0 * * * *"
    description: "Hourly account rebalancing"
  
  # Profit collection at 2 AM UTC
  profit_collection:
    enabled: true
    schedule: "0 2 * * *"
    description: "Collect profits from sub accounts"
  
  # Minimum balance check every 15 minutes
  min_balance_check:
    enabled: true
    schedule: "*/15 * * * *"
    description: "Check minimum balance requirements"

# Account-specific settings
account_settings:
  binance:
    main:
      always_maintain_min: true
      auto_collect_profits: true
    
    sub_arbitrage:
      max_daily_transfers: 100
      profit_threshold: 100.0  # USDT
    
    sub_market_making:
      max_daily_transfers: 200
      profit_threshold: 50.0   # USDT
    
    sub_trend_following:
      max_daily_transfers: 50
      profit_threshold: 200.0  # USDT

# Notification settings
notifications:
  # Send notification for large transfers
  large_transfer_threshold:
    USDT: 10000.0
    BTC: 0.1
    ETH: 1.0
  
  # Send notification for failed transfers
  notify_on_failure: true
  
  # Send daily summary
  daily_summary: true
  summary_time: "08:00"  # UTC