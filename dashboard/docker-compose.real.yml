version: '3.8'

services:
  dashboard-real:
    build:
      context: .
      dockerfile: Dockerfile.real
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - ENVIRONMENT=production
    depends_on:
      - nats
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    networks:
      - oms-network
    restart: unless-stopped

networks:
  oms-network:
    external: true
    name: mExOms_default