services:
  # Infrastructure Services
  nats:
    image: nats:latest
    container_name: nats-oms
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    volumes:
      - nats-data:/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4222"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis-oms
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  vault:
    image: hashicorp/vault:latest
    container_name: vault-oms
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/data
      - ./configs/vault-config.hcl:/vault/config/config.hcl
    command: server
    networks:
      - oms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8200/v1/sys/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  nats-data:
  vault-data:
  redis-data:

networks:
  oms-network:
    driver: bridge